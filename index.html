<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>F.C. IS App</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header style="text-align: center; padding: 10px 0;">
  <img src="fc_is.jpg" alt="Logo du FC IS" style="max-height: 80px; width: auto; display: block; margin: 0 auto;">
</header>

  <div id="root"></div>

  <nav id="main-nav">
    <a href="#home" onclick="updateActive(this)">Accueil</a>
    <a href="#matches" onclick="updateActive(this)">Matchs</a>
    <a href="#stats" onclick="updateActive(this)">Stats</a>
    <a href="#players" onclick="updateActive(this)">Effectif</a>
    <a href="#announcements" onclick="updateActive(this)">Infos</a>
  </nav>

  <script src="app.js"></script> 

  <script>
    // Enregistrement et mise à jour dynamique du Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').then((registration) => {
          
          // Force la vérification des mises à jour à chaque chargement de page
          registration.update();

          // Détection automatique d'une nouvelle version (changement de v17 à v18, etc.)
          registration.onupdatefound = () => {
            const installingWorker = registration.installing;
            if (installingWorker == null) return;

            installingWorker.onstatechange = () => {
              if (installingWorker.state === 'installed') {
                if (navigator.serviceWorker.controller) {
                  console.log('Nouveau contenu disponible, rechargement automatique...');
                  window.location.reload();
                }
              }
            };
          };

        }).catch(err => console.log('Erreur SW :', err));
      });
    }
    
    // Fonction pour surligner l'onglet actif
    function updateActive(element) {
        document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
        element.classList.add('active');
    }
  </script>
</body>
</html>
