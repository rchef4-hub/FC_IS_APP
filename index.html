<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F.C. IS - Application Officielle</title>

  <!-- LFA / PWA CONFIGURATION -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2c3e50">

  <!-- Apple iOS Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FCIS">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Styles CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- EN-TÊTE ET NAVIGATION -->
  <header>
    <div class="logo-container">
      <img src="icon-192.png" alt="FC IS Logo" class="app-logo" onerror="this.style.display='none'">
      <h1>F.C. IS</h1>
    </div>
    <nav>
      <ul>
        <li><a href="#home" class="active">🏠 Accueil</a></li>
        <li><a href="#matches">📅 Matchs</a></li>
        <li><a href="#stats">📊 Stats</a></li>
        <li><a href="#players">👥 Effectif</a></li>
        <li><a href="#announcements">📢 Annonces</a></li>
        <li><a href="#admin">⚙️ Admin</a></li>
      </ul>
    </nav>
  </header>

  <!-- CONTENU DYNAMIQUE (GÉRÉ PAR APP.JS) -->
  <main id="root">
    <!-- Le contenu des pages s'affiche ici -->
  </main>

  <!-- PIED DE PAGE -->
  <footer>
    <p>&copy; 2026-2027 F.C. IS — Tous droits réservés</p>
  </footer>

  <!-- CHARGEMENT DU SCRIPT PRINCIPAL -->
  <script src="app.js"></script>

  <!-- ENREGISTREMENT DU SERVICE WORKER (MODE APP MOBILE) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker enregistré avec succès !', reg))
          .catch(err => console.error('Erreur d\'enregistrement du Service Worker :', err));
      });
    }
  </script>
</body>
</html>
