<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F.C. IS</title>

  <!-- CONFIGURATION PWA / MOBILE -->
  <link rel="manifest" href="manifest.json?v=3">
  <meta name="theme-color" content="#6a0f49">

  <!-- Favicon / Icône Android & Navigateurs -->
  <link rel="icon" type="image/png" href="fc_is.png?v=3">

  <!-- Apple iOS & Android Shortcut Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="F.C. IS">
  <link rel="apple-touch-icon" href="fc_is.png?v=3">

  <!-- Styles CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- EN-TÊTE -->
  <header>
    <div class="logo-container">
      <img src="fc_is.png?v=3" alt="FC IS Logo" class="app-logo">
      <h1>F.C. IS</h1>
    </div>
  </header>

  <!-- CONTENU DYNAMIQUE -->
  <main id="root">
    <!-- Le contenu s'affiche ici via app.js -->
  </main>

  <!-- NAVIGATION FIXE EN BAS -->
  <nav>
    <ul>
      <li><a href="#home" class="active">🏠 Accueil</a></li>
      <li><a href="#matches">📅 Matchs</a></li>
      <li><a href="#stats">📊 Stats</a></li>
      <li><a href="#players">👥 Effectif</a></li>
      <li><a href="#announcements">📢 Annonces</a></li>
      <!-- Onglet Admin masqué par défaut -->
      <li id="admin-nav-item" style="display: none;"><a href="#admin">⚙️ Admin</a></li>
    </ul>
  </nav>

  <!-- SCRIPT PRINCIPAL -->
  <script src="app.js"></script>

  <!-- SERVICE WORKER (MODE APP) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
